server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  # Vite adds a hash in the file names, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React router: every page returns index.html
  location / {
    try_files $uri /index.html;
  }
}
