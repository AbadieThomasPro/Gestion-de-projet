frontend:
  - changed-files:
      - any-glob-to-any-file: frontend/**

backend:
  - changed-files:
      - any-glob-to-any-file: backend/**

infra:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '**/Dockerfile', 'docker-compose.yml']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']
